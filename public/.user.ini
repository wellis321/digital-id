; Force PHP to always check each file's modification time before trusting
; OPcache's compiled bytecode, rather than trusting a cached compile for a
; period after the file changes. Without this, a deploy that overwrites a
; file can leave some PHP-FPM workers serving stale (or, if the overwrite
; raced with a compile, corrupted/truncated) cached output indefinitely on
; hosts where revalidation is infrequent or disabled by default.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
